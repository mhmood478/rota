<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit monthly rota</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="editor-page">
  <header class="editor-header">
    <a href="index.html" class="back-link">← On-call board</a>
    <div class="editor-brand">Monthly rota editor</div>
  </header>

  <main class="editor-main">
    <section id="loginPanel" class="login-card">
      <div class="eyebrow">SPECIALTY ACCESS</div>
      <h1 id="loginTitle">Edit rota</h1>
      <p>Enter your specialty’s passcode to open its monthly rota.</p>
      <label class="field-label" for="specialtySelect">Specialty</label>
      <select id="specialtySelect" class="text-field"></select>
      <label class="field-label" for="passcodeInput">Passcode</label>
      <input id="passcodeInput" class="text-field" type="password"
             autocomplete="current-password" placeholder="Enter passcode">
      <button id="loginButton" class="button button-primary full-width" type="button">
        Open rota
      </button>
      <div id="loginError" class="form-message error-message"></div>
    </section>

    <section id="rotaPanel" class="rota-panel hidden">
      <div class="rota-heading">
        <div>
          <div class="eyebrow">MONTHLY SCHEDULE</div>
          <h1 id="rotaTitle">Rota</h1>
          <p>Fill in the on-call details for each date, then save the month.</p>
        </div>
        <button id="changeSpecialty" class="button button-secondary" type="button">
          Change specialty
        </button>
      </div>

      <div class="month-toolbar">
        <label class="field-label" for="monthInput">Month</label>
        <input id="monthInput" class="text-field month-input" type="month">
        <button id="loadMonth" class="button button-secondary" type="button">Load month</button>
        <button id="saveMonth" class="button button-primary" type="button">Save rota</button>
      </div>

      <div id="saveMessage" class="form-message"></div>
      <div id="rotaRows" class="rota-rows"></div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="config.js"></script>
  <script src="editor.js"></script>
</body>
</html>
