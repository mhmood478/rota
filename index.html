<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>On-call board</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="display-page">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">+</div>
      <div>
        <div class="brand-title">ON-CALL BOARD</div>
        <div class="brand-subtitle">Emergency Department</div>
      </div>
    </div>

    <div class="clock-block">
      <div id="clock" class="clock">--:--</div>
      <div id="today" class="today">Loading date…</div>
      <div class="timezone">MCT · Shift changes at 07:00</div>
    </div>

    <button id="customizeButton" class="button button-secondary" type="button">
      Customize display
    </button>
  </header>

  <main class="main-content">
    <div id="notice" class="notice" role="status"></div>

    <section id="customizePanel" class="customize-panel hidden" aria-label="Display options">
      <div class="customize-heading">
        <div>
          <strong>Display settings</strong>
          <span>These settings are saved only in this browser.</span>
        </div>
        <button id="closeCustomize" class="icon-button" type="button" aria-label="Close">×</button>
      </div>

      <label class="color-control">
        Accent color
        <input id="accentPicker" type="color" value="#53d6b2">
      </label>

      <div class="arrange-heading">Arrange specialties</div>
      <div id="arrangeList" class="arrange-list"></div>

      <button id="resetDisplay" class="button button-secondary" type="button">
        Reset display settings
      </button>
    </section>

    <section id="specialtyGrid" class="specialty-grid" aria-label="Today's on-call doctors"></section>
  </main>

  <footer class="footer">
    <span>On-call information · Please confirm by phone when necessary</span>
    <span id="updatedAt"></span>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
